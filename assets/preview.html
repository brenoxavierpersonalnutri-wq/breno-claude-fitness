<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1a1a1a; color: #fff; font-family: Arial; padding: 40px; }
  .row { display: flex; gap: 40px; align-items: flex-end; margin-bottom: 40px; flex-wrap: wrap; }
  .item { text-align: center; }
  .item img { display: block; }
  .item p { margin-top: 8px; font-size: 13px; color: #aaa; }
  h1 { font-size: 18px; margin-bottom: 20px; }
  .preview-ios { background: linear-gradient(180deg, #1e3a5f 0%, #0a1628 100%); padding: 30px; border-radius: 16px; margin-top: 30px; }
  .preview-ios-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 360px; }
  .preview-ios-grid .app { text-align: center; }
  .preview-ios-grid img { width: 60px; height: 60px; border-radius: 14px; }
  .preview-ios-grid p { margin: 6px 0 0; font-size: 11px; color: #fff; }
</style>
</head>
<body>

<h1>Ícones gerados — tamanhos reais</h1>

<div class="row">
  <div class="item">
    <img src="icon-1024.png" width="1024" height="1024" style="max-width: 300px; height: auto;">
    <p>1024×1024 (App Store)</p>
  </div>
  <div class="item">
    <img src="icon-512.png">
    <p>512×512 (PWA manifest)</p>
  </div>
  <div class="item">
    <img src="icon-192.png">
    <p>192×192 (PWA Android)</p>
  </div>
  <div class="item">
    <img src="apple-touch-icon.png">
    <p>180×180 (iOS home)</p>
  </div>
</div>

<h1 style="margin-top: 60px;">Como vai aparecer num iPhone</h1>
<div class="preview-ios">
  <div class="preview-ios-grid">
    <div class="app"><img src="apple-touch-icon.png"><p>BX Fit</p></div>
    <div class="app" style="background:#007aff;border-radius:14px;width:60px;height:60px;"><p style="color:#fff;line-height:60px;">📱</p></div>
    <div class="app" style="background:#34c759;border-radius:14px;width:60px;height:60px;"><p style="color:#fff;line-height:60px;">💬</p></div>
    <div class="app" style="background:#ff9500;border-radius:14px;width:60px;height:60px;"><p style="color:#fff;line-height:60px;">📷</p></div>
  </div>
</div>

</body>
</html>
